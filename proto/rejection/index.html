<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backlot: rejection loop prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--accent:#807eff;--mute:#a3a09a}
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;color:#222;font-family:Manrope,system-ui,sans-serif}
  #app{position:relative;width:100%}
  .bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:0 0 12px}
  .tag{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 14px 0 10px;border-right:1px solid #e1e1e1;margin-right:6px;font-size:12.5px;font-weight:500;color:#222;white-space:nowrap}
  .tag i{width:8px;height:8px;border-radius:50%;background:#728437;animation:live 1.6s ease-in-out infinite}
  @keyframes live{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.tag i{animation:none}}
  .steps{display:flex;gap:0;flex-wrap:wrap;min-width:0}
  .tab{display:flex;align-items:center;height:30px;padding:0 13px;border-radius:999px;border:1px solid #e1e1e1;background:#fff;font:500 12.5px/1 Manrope,sans-serif;color:#707070;white-space:nowrap;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
  .tab[aria-selected=true]{background:#f1f0ff;border-color:var(--accent);color:#222}
  .step{display:flex;align-items:center;gap:6px;height:30px;padding:0;font:500 12.5px/1 Manrope,sans-serif;color:#9a9a9a;white-space:nowrap;cursor:default}
  .step+.step::before{content:"";width:22px;height:2px;border-radius:1px;background:#e1e1e1;margin:0 6px 0 4px;transition:background .3s}
  .step.done+.step::before,.step.on::before{background:var(--accent)}
  .step b{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1.5px solid #cfcfcf;font-weight:600;font-size:9px;box-sizing:border-box;transition:background .3s,border-color .3s,color .3s}
  .step.on{color:#222}
  .step.on b{background:#fff;border-color:var(--accent);color:var(--accent)}
  .step.done{color:#555}
  .step.done b{background:var(--accent);border-color:var(--accent);color:#fff}
  .right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .btn{font:500 12.5px/1 Manrope,sans-serif;height:30px;padding:0 12px;border-radius:999px;border:1px solid #d4d4d4;background:#fff;color:#222;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
  .btn:hover,.tab:hover{background:#f4f4f4}
  .btn:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ibtn{width:32px;height:32px;border-radius:50%;border:1px solid #d4d4d4;background:#fff;color:#222;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;text-decoration:none;transition:background .2s}
  .ibtn:hover{background:#f1f1f1}
  .ibtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .mode{font-size:12px;color:#777;white-space:nowrap}
  .stage{position:relative;overflow:hidden;border-radius:8px;background:#121212}
  .stage .pf{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0}.stage .pf img{position:absolute;inset:0;width:100%;height:100%;display:block}.stage .pf.off{opacity:0;pointer-events:none}.ty{position:absolute;left:270px;top:716px;width:680px;height:58px;padding:7px 9px;box-sizing:border-box;background:#191919;border-radius:7px;font:12px/1.5 Manrope,system-ui,sans-serif;color:#d4d2cf;white-space:pre-wrap}.ty:empty{display:none}.ov.on{pointer-events:auto;cursor:default}
  .stage iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0;transition:opacity .35s ease}
  .stage iframe.off{opacity:0;pointer-events:none}
  .ov{position:absolute;inset:0;pointer-events:none}
  .ring{position:absolute;border-radius:10px;box-shadow:0 0 0 2px var(--accent),0 0 0 6px rgba(145,132,217,.25);transition:all .35s cubic-bezier(.4,0,.2,1);opacity:0}
  .ring.show{opacity:1;animation:pulse 1.6s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 2px var(--accent),0 0 0 2px rgba(145,132,217,.45)}100%{box-shadow:0 0 0 2px var(--accent),0 0 0 14px rgba(145,132,217,0)}}
  .tip{position:absolute;max-width:220px;padding:8px 11px;border-radius:9px;background:#f5f3f0;color:#1a1a1a;font-size:12px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .25s,transform .25s;transform:translateY(4px)}
  .tip.show{opacity:1;transform:none}
  .tip small{display:block;color:#78756f;font-size:11px;margin-bottom:3px}
  .tip.nudge{animation:nudge .35s}
  @keyframes nudge{20%{transform:translateX(-5px)}50%{transform:translateX(5px)}80%{transform:translateX(-3px)}}
  .cur{position:absolute;left:0;top:0;width:22px;height:22px;transition:transform .8s cubic-bezier(.4,0,.2,1),opacity .3s;opacity:0}
  .cur.show{opacity:1}
  .cur.click svg{transform:scale(.85)}
  .banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.96);padding:14px 22px;border-radius:12px;background:#f5f3f0;color:#1a1a1a;font-size:16px;font-weight:500;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;box-shadow:0 12px 32px rgba(0,0,0,.45)}
  .banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .end{position:absolute;left:50%;top:38%;transform:translate(-50%,calc(-50% + 8px));display:flex;align-items:center;gap:16px;max-width:calc(100% - 32px);padding:12px 12px 12px 18px;border-radius:12px;background:#f5f3f0;color:#1a1a1a;box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
  .end.show{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
  .end h2{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
  .end p{margin:2px 0 0;color:#5f5c57;font-size:12.5px}
  @media (max-width:700px){.step span{display:none}.step+.step::before{width:12px}.mode{display:none}.right{margin-left:0}}
  @media (prefers-reduced-motion:reduce){.ring.show{animation:none}.cur,.ring,.tip,.banner,.stage iframe{transition:none}}

  /* step numbers: black and white, centred */
  .step b{width:18px;height:18px;padding-top:1px;font-size:10px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;border:1.5px solid #cfcfcf;box-sizing:border-box}
  .step.on b{background:#fff;border-color:#161616;color:#161616}
  .step.done b{background:#161616;border-color:#161616;color:#fff}
  .step.done+.step::before,.step.on::before{background:#161616}

  /* header: label on top, title or steps under it, controls on the right */
  .bar{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;row-gap:4px;align-items:center;padding:0 0 16px}
  .bar>.tag{grid-column:1;border-right:0;padding:0;margin:0;height:22px}
  .bar>.steps,.bar>.instr{grid-column:1;grid-row:2}
  .bar>.right{grid-column:2;grid-row:1/3;margin-left:0}
  .instr{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:30px;color:#222;white-space:nowrap}
  .bar>.right{flex-direction:column;align-items:flex-end;gap:6px}
  .bar>.right .mode{order:-1}
  .bar>.right .ibtn+.ibtn,.bar>.right .ibtn{margin:0}
  .right .btns{display:flex;gap:8px}
  .steps{flex-wrap:nowrap}
  @media (max-width:1100px){.step:not(.on) span{display:none}}
  @media (max-width:700px){.bar{grid-template-columns:1fr}.bar>.right{grid-column:1;grid-row:3;align-items:flex-start}}
  /* on the green card of the case page: light text */
  html.on-green body{color:#fff}
  html.on-green .tag{color:rgba(255,255,255,.85)}
  html.on-green .tag i{background:#fff;animation:live 1.6s ease-in-out infinite}
  @keyframes livew{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}70%{box-shadow:0 0 0 7px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
  @media (prefers-reduced-motion:reduce){html.on-green .tag i{animation:none}}
  html.on-green .instr{color:#fff}
  html.on-green .step{color:rgba(255,255,255,.65)}
  html.on-green .step b{border-color:rgba(255,255,255,.55);color:rgba(255,255,255,.85)}
  html.on-green .step.on{color:#fff}
  html.on-green .step.on b{background:transparent;border-color:#fff;color:#fff}
  html.on-green .step.done{color:rgba(255,255,255,.9)}
  html.on-green .step.done b{background:#fff;border-color:#fff;color:#56652A}
  html.on-green .step+.step::before{background:rgba(255,255,255,.3)}
  html.on-green .step.done+.step::before,html.on-green .step.on::before{background:#fff}
  html.on-green .mode{color:rgba(255,255,255,.85)}
  html.on-green .ibtn{border-color:#fff}
  /* step numbers: the digit itself sits in the middle of the circle, not its line box */
  .step b{display:inline-flex;align-items:center;justify-content:center;padding:0!important;line-height:1}
  .step b em{display:block;font-style:normal;line-height:1;text-box:trim-both cap alphabetic}
  /* site type for the frame around the product */
  .bar,.bar *{font-family:"Inter Tight",Manrope,system-ui,sans-serif!important}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>if(/[?&]on=green/.test(location.search))document.documentElement.classList.add('on-green')</script>
<script>if(window.top!==window)document.documentElement.classList.add("emb")</script><style>.emb .tag,.emb .instr{display:none!important}.right .mode{display:inline-flex;align-items:center;height:32px;line-height:1}.end{display:none!important}</style></head>
<body>
<div id="app">
  <div class="bar">
    <span class="tag"><i></i>Interactive prototype</span>
    <div class="steps" aria-label="Steps">
      <div class="step" data-s="1"><b><em>1</em></b><span>Publisher flags a field</span></div>
      <div class="step" data-s="2"><b><em>2</em></b><span>Rejects</span></div>
      <div class="step" data-s="3"><b><em>3</em></b><span>Editor resolves</span></div>
      <div class="step" data-s="4"><b><em>4</em></b><span>Resubmits</span></div>
    </div>
    <div class="right">
    <span class="mode" id="mode" aria-live="polite">Your turn. Click anywhere for a hint.</span>
    <span class="btns"><button class="ibtn" id="restart" type="button" aria-label="Restart" title="Restart"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <a class="ibtn" id="full" href="./" target="_blank" rel="noopener" aria-label="Open full screen" title="Open full screen"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2"/></svg></a></span>
    </div>
  </div>
  <div class="stage" id="stage">
    <div class="pf" id="pub" aria-label="Publisher review screen for Lupin Season 4 Episode 2"><img id="pimg" src="rc.webp" alt=""><div class="ty" id="ty"></div></div>
    <iframe id="ed" src="../dc/ed-rejected.html" title="Editor episode screen" class="off" tabindex="-1" loading="lazy"></iframe>
    <div class="ov on" id="ov">
      <div class="ring" id="ring"></div>
      <div class="tip" id="tip" role="status" aria-live="polite"></div>
      <div class="cur" id="cur"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M4 2l13 8-6 1.5L8 18z" fill="#f5f3f0" stroke="#121212" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
      <div class="banner" id="banner">Now you're the editor</div>
    </div>
    <div class="end" id="end">
      <div><h2>Two reasons, resolved in place. No second round.</h2>
      <p>The publisher re-checks two fields, not the whole episode.</p></div><button class="ibtn" id="again" type="button" aria-label="Play again" title="Play again"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
</div>
<script>
(function(){
const W=1440,H=900,$=id=>document.getElementById(id);
const stage=$('stage'),pub=$('pub'),pimg=$('pimg'),ty=$('ty'),ed=$('ed'),ov=$('ov'),ring=$('ring'),tip=$('tip'),cur=$('cur'),banner=$('banner'),endEl=$('end'),mode=$('mode');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let s=1,step=-1,busy=false,tipOn=false,tipTimer=null,timer=null,run=0;
const sleep=ms=>new Promise(r=>{timer=setTimeout(r,reduce?Math.min(ms,150):ms)});
const R1='Spain needs the ICAA rating for this episode. Set it to 16 before resubmitting.';
const SYN='Assane se acerca a la finca Pellegrini justo cuando empieza la subasta.';
['ac','cs','sc','cr'].forEach(k=>{const i=new Image();i.src=k+'.webp'});
const ED=()=>ed.contentDocument;
const box=(x,y,w,h)=>()=>({x,y,w,h});
const inEd=sel=>()=>{try{const e=typeof sel==='function'?sel():ED().querySelector(sel);if(!e)return null;const r=e.getBoundingClientRect();return{x:r.left,y:r.top,w:r.width,h:r.height}}catch(e){return null}};
const subBtn=()=>[...ED().querySelectorAll('[role=button]')].find(e=>e.textContent.trim()==='Submit for review');
function setVal(el,v,ev){const pr=el.tagName==='SELECT'?HTMLSelectElement.prototype:HTMLTextAreaElement.prototype;const set=Object.getOwnPropertyDescriptor(ed.contentWindow[pr===HTMLSelectElement.prototype?'HTMLSelectElement':'HTMLTextAreaElement'].prototype,'value').set;set.call(el,v);el.dispatchEvent(new ed.contentWindow.Event(ev,{bubbles:true}))}
const STEPS=[
 {s:1,r:box(82,668,882,36),tip:'You are the publisher. Spain has no age rating for this episode. Flag the Age rating row.',a:async()=>{pimg.src='ac.webp'}},
 {s:1,r:box(268,714,684,64),tip:'Say what needs to change.',a:async()=>{for(let i=1;i<=R1.length;i+=reduce?R1.length:2){ty.textContent=R1.slice(0,i);await sleep(18)}ty.textContent=R1}},
 {s:1,r:box(871,788,80,32),tip:'Save it. The comment stays attached to the field.',a:async()=>{ty.textContent='';pimg.src='cs.webp';await sleep(1300);tipOn=true;banner.textContent='The empty Spanish synopsis gets a second reason the same way';banner.classList.add('show');await sleep(1900);banner.classList.remove('show');pimg.src='sc.webp';tipOn=false}},
 {s:2,r:box(1249,511,149,32),tip:'Reject. Each reason goes back with its field.',a:async()=>{pimg.src='cr.webp'}},
 {s:2,r:box(815,397,96,32),tip:'Confirm the rejection.',a:async()=>{banner.textContent='Now you\u2019re the editor';banner.classList.add('show');await sleep(1300);ed.classList.remove('off');pub.classList.add('off');await sleep(500);banner.classList.remove('show')}},
 {s:3,r:inEd('#in-age'),tip:'Both reasons land on their fields. Set the age rating.',a:async()=>{setVal(ED().getElementById('in-age'),'16','change')}},
 {s:3,r:inEd('#in-syn'),tip:'Now write the Spanish synopsis.',a:async()=>{const t=ED().getElementById('in-syn');for(let i=1;i<=SYN.length;i+=reduce?SYN.length:3){setVal(t,SYN.slice(0,i),'input');await sleep(16)}setVal(t,SYN,'input')}},
 {s:4,r:inEd(subBtn),tip:'Both reasons are resolved. Resubmit.',a:async()=>{await sleep(300);endEl.classList.add('show');mode.textContent='Done.'}}
];
function size(){if(window.top!==window)return;const c=document.getElementById('app')||document.body;c.style.maxWidth='';c.style.margin='0 auto';const top=stage.getBoundingClientRect().top+scrollY;const w=Math.min(c.clientWidth,(innerHeight-top-16)*1440/900);c.style.maxWidth=Math.max(320,w)+'px'}
var maxH=0;function post(){var h=document.body.scrollHeight;if(h<maxH)return;maxH=h;try{parent.postMessage({backlotProto:'rejection',height:h},'*')}catch(e){}}
function fit(){maxH=0;size();s=stage.clientWidth/W;[pub,ed].forEach(f=>f.style.transform='scale('+s+')');stage.style.height=(H*s)+'px';place();post()}
addEventListener('resize',fit);addEventListener('load',fit);
function setSteps(n){document.querySelectorAll('.step').forEach(e=>{const v=+e.dataset.s;e.classList.toggle('on',v===n);e.classList.toggle('done',v<n)})}
function rect(st){const r=st&&st.r();return r?{x:r.x*s,y:r.y*s,w:r.w*s,h:r.h*s}:null}
function place(){
  const st=STEPS[step];const r=rect(st);
  if(!r||busy||!tipOn){ring.classList.remove('show');tip.classList.remove('show');return}
  const p=4;Object.assign(ring.style,{left:(r.x-p)+'px',top:(r.y-p)+'px',width:(r.w+2*p)+'px',height:(r.h+2*p)+'px'});ring.classList.add('show');
  tip.innerHTML='<small>Step '+st.s+' of 4</small>'+st.tip;tip.classList.add('show');
  const tw=tip.offsetWidth,th=tip.offsetHeight,sw=stage.clientWidth,sh=stage.clientHeight;
  let x=r.x+r.w/2-tw/2,y=r.y+r.h+12;if(y+th>sh-8)y=r.y-th-12;
  x=Math.max(8,Math.min(sw-tw-8,x));y=Math.max(8,y);tip.style.left=x+'px';tip.style.top=y+'px';
}
function showTip(ms){tipOn=true;clearTimeout(tipTimer);place();tipTimer=setTimeout(()=>{tipOn=false;place()},ms||2800)}
function go(i){step=i;const st=STEPS[i];if(st)setSteps(st.s);place()}
async function act(){const id=run;busy=true;tipOn=false;place();await STEPS[step].a();if(id!==run)return;busy=false;if(step<STEPS.length-1){go(step+1);if(step===5)showTip(3600)}else{step=STEPS.length;setSteps(5)}}
ov.addEventListener('click',e=>{
  if(busy||step<0||step>=STEPS.length)return;
  const r=rect(STEPS[step]),b=stage.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
  if(r&&x>=r.x-6&&x<=r.x+r.w+6&&y>=r.y-6&&y<=r.y+r.h+6){mode.textContent='Your turn. Click anywhere for a hint.';act();return}
  showTip();tip.classList.remove('nudge');void tip.offsetWidth;if(!reduce)tip.classList.add('nudge');
});
/* the page asks for one hint when the prototype first scrolls into view */
addEventListener('message',e=>{if(e.data&&e.data.blHint&&step===0&&!busy&&!tipOn)showTip(4200)});
async function start(){
  run++;clearTimeout(timer);busy=false;tipOn=false;endEl.classList.remove('show');banner.classList.remove('show');ty.textContent='';pimg.src='rc.webp';
  pub.classList.remove('off');ed.classList.add('off');
  await new Promise(r=>{ed.onload=r;ed.src='../dc/ed-rejected.html?'+run});
  fit();go(0);
}
$('restart').onclick=()=>start();
$('again').onclick=()=>start();
ed.addEventListener('load',()=>{try{const d=ED();d.documentElement.style.overflow='hidden';d.body.style.overflow='hidden'}catch(e){}});
if(window.top===window){const fl=document.getElementById('full');if(fl)fl.remove();document.body.style.padding='16px'}
fit();go(0);
})();
</script>
</body>
</html>
