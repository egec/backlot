<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backlot: rejection loop prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--accent:#807eff;--mute:#a3a09a}
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;color:#222;font-family:Manrope,system-ui,sans-serif}
  #app{position:relative;width:100%}
  .bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:0 0 12px}
  .tag{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:999px;background:#222;color:#fff;font-size:12.5px;font-weight:500;white-space:nowrap}
  .tag i{width:7px;height:7px;border-radius:50%;background:#7ee08a}
  .steps{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
  .step,.tab{display:flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 6px;border-radius:999px;border:1px solid #e1e1e1;background:#fff;font:500 12.5px/1 Manrope,sans-serif;color:#707070;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
  .tab{padding:0 13px;cursor:pointer}
  .step b{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;border:1px solid #cfcfcf;font-weight:500;font-size:11px}
  .step.on,.tab[aria-selected=true]{background:#f1f0ff;border-color:var(--accent);color:#222}
  .step.on b{border-color:var(--accent);color:#5f5cf0}
  .step.done{color:#222}
  .step.done b{background:#222;border-color:#222;color:#fff}
  .right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .btn{font:500 12.5px/1 Manrope,sans-serif;height:30px;padding:0 12px;border-radius:999px;border:1px solid #d4d4d4;background:#fff;color:#222;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
  .btn:hover,.tab:hover{background:#f4f4f4}
  .btn:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .mode{font-size:12px;color:#777;white-space:nowrap}
  .stage{position:relative;overflow:hidden;border-radius:8px;background:#121212}
  .stage iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0;transition:opacity .35s ease}
  .stage iframe.off{opacity:0;pointer-events:none}
  .ov{position:absolute;inset:0;pointer-events:none}
  .ring{position:absolute;border-radius:10px;box-shadow:0 0 0 2px var(--accent),0 0 0 6px rgba(145,132,217,.25);transition:all .35s cubic-bezier(.4,0,.2,1);opacity:0}
  .ring.show{opacity:1;animation:pulse 1.6s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 2px var(--accent),0 0 0 2px rgba(145,132,217,.45)}100%{box-shadow:0 0 0 2px var(--accent),0 0 0 14px rgba(145,132,217,0)}}
  .tip{position:absolute;max-width:260px;padding:10px 12px;border-radius:10px;background:#f5f3f0;color:#1a1a1a;font-size:12.5px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .25s,transform .25s;transform:translateY(4px)}
  .tip.show{opacity:1;transform:none}
  .tip small{display:block;color:#78756f;font-size:11px;margin-bottom:3px}
  .tip.nudge{animation:nudge .35s}
  @keyframes nudge{20%{transform:translateX(-5px)}50%{transform:translateX(5px)}80%{transform:translateX(-3px)}}
  .cur{position:absolute;left:0;top:0;width:22px;height:22px;transition:transform .8s cubic-bezier(.4,0,.2,1),opacity .3s;opacity:0}
  .cur.show{opacity:1}
  .cur.click svg{transform:scale(.85)}
  .banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.96);padding:14px 22px;border-radius:12px;background:#f5f3f0;color:#1a1a1a;font-size:16px;font-weight:500;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;box-shadow:0 12px 32px rgba(0,0,0,.45)}
  .banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .end{color:#edebe8;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(18,18,18,.82);opacity:0;pointer-events:none;transition:opacity .35s;text-align:center;padding:24px}
  .end.show{opacity:1;pointer-events:auto}
  .end h2{margin:0;font-size:22px;font-weight:500;letter-spacing:-.01em}
  .end p{margin:0;color:var(--mute);font-size:13.5px}
  @media (max-width:700px){.step span{display:none}.step{padding:0 6px}.mode{display:none}.right{margin-left:0}}
  @media (prefers-reduced-motion:reduce){.ring.show{animation:none}.cur,.ring,.tip,.banner,.stage iframe{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <span class="tag"><i></i>Interactive prototype</span>
    <div class="steps" aria-label="Steps">
      <div class="step" data-s="1"><b>1</b><span>Publisher flags a field</span></div>
      <div class="step" data-s="2"><b>2</b><span>Rejects</span></div>
      <div class="step" data-s="3"><b>3</b><span>Editor resolves</span></div>
      <div class="step" data-s="4"><b>4</b><span>Resubmits</span></div>
    </div>
    <div class="right">
    <span class="mode" id="mode">Playing. Click anywhere to take over.</span>
    <button class="btn" id="restart" type="button">Restart</button>
    <a class="btn" id="full" href="./" target="_blank" rel="noopener">Open full screen ↗</a>
    </div>
  </div>
  <div class="stage" id="stage">
    <iframe id="pub" src="pub.html" title="Publisher review screen" tabindex="-1"></iframe>
    <iframe id="ed" src="ed.html" title="Editor episode screen" class="off" tabindex="-1"></iframe>
    <div class="ov" id="ov">
      <div class="ring" id="ring"></div>
      <div class="tip" id="tip" role="status" aria-live="polite"></div>
      <div class="cur" id="cur"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M4 2l13 8-6 1.5L8 18z" fill="#f5f3f0" stroke="#121212" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
      <div class="banner" id="banner">Now you're the editor</div>
    </div>
    <div class="end" id="end">
      <h2>Two reasons, resolved in place. No second round.</h2>
      <p>The publisher re-checks two fields, not the whole episode.</p>
      <button class="btn" id="again" type="button">Play again</button>
    </div>
  </div>
</div>
<script>
(function(){
const W=1440,H=900;
const $=id=>document.getElementById(id);
const stage=$('stage'),pubF=$('pub'),edF=$('ed'),ring=$('ring'),tip=$('tip'),cur=$('cur'),banner=$('banner'),endEl=$('end'),mode=$('mode');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let s=1,auto=!reduce,visible=false,step=-1,busy=false,timer=null,run=0;
const ED='Alex Rivard';
const R1={n:1,key:'1',field:'Age rating',cat:'Compliance',flag:'No rating for Spain',text:'Spain needs the ICAA rating for this episode. Set it to 16 before resubmitting.'};
const R2={n:2,key:'2',field:'Synopsis (ES)',cat:'Localization',flag:'Empty, the catalogue falls back to French',text:'The Spanish synopsis is empty, so the Spain catalogue falls back to French. Please write it before resubmitting.'};
const SYN='Assane se acerca a la finca Pellegrini justo cuando empieza la subasta.';
const sleep=ms=>new Promise(r=>{timer=setTimeout(r,ms)});

function fit(){s=stage.clientWidth/W;[pubF,edF].forEach(f=>f.style.transform='scale('+s+')');stage.style.height=(H*s)+'px';place();post()}
function post(){try{parent.postMessage({backlotProto:'rejection',height:document.body.scrollHeight},'*')}catch(e){}}
addEventListener('resize',fit);

/* ---------- helpers inside frames ---------- */
const D=f=>f.contentDocument;
const T=(d,id,i)=>d.querySelectorAll('[data-dc-tpl="'+id+'"]')[i||0];
const P=(d,k)=>d.querySelector('[data-p="'+k+'"]');
function txt(d,id,v){const e=T(d,id);if(e)e.textContent=v}
function html(d,id,v){const e=T(d,id);if(e)e.innerHTML=v}
function el(d,h){const t=d.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild}
const chip='display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;background:var(--color-neutral-900);font-size:11px;font-weight:500;color:var(--color-neutral-300);white-space:nowrap';
function CARD(R,right){return '<div data-p="rcard'+R.key+'" style="border-radius:var(--radius-md);background:var(--color-surface-sunken);border:1px solid var(--color-neutral-900);padding:11px 12px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:10.5px;color:var(--color-neutral-600);flex:0 0 auto">'+R.n+'</span><span style="display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:var(--radius-md);background:var(--color-neutral-900);font-size:11.5px;color:var(--color-text);white-space:nowrap;flex:0 0 auto"><i class="ph ph-link-simple" style="font-size:11px;color:var(--color-neutral-500)"></i>'+R.field+'</span><span style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:var(--radius-md);border:1px solid var(--color-neutral-800);color:var(--color-neutral-300);font-size:12px;font-weight:500;white-space:nowrap;flex:0 0 auto">'+R.cat+'<i class="ph ph-caret-down" style="font-size:11px;color:var(--color-neutral-600)"></i></span><div style="flex:1 1 0%"></div>'+right+'</div><div style="margin-top:9px;min-height:64px;padding:8px 10px;border-radius:var(--radius-md);background:var(--color-surface);border:1px solid var(--color-neutral-800);font-size:12px;color:var(--color-neutral-300);line-height:1.5;text-wrap:pretty">'+R.text+'</div></div>'}
const X='<i class="ph ph-x" style="font-size:13px;color:var(--color-neutral-600);flex:0 0 auto"></i>';
function statusChip(d,chipEl,label,kind){
  chipEl.style.background='var(--st-'+kind+'-bg)';chipEl.style.border='1px solid var(--st-'+kind+'-line, transparent)';chipEl.style.color='var(--st-'+kind+'-ink)';
  chipEl.innerHTML='<i class="ph ph-'+(kind==='rejected'?'x-circle':'clock')+'" style="font-size:13px"></i><span style="display:block;color:var(--st-'+kind+'-ink)">'+label+'</span>';
}
function flagRow(d,row,lab,val,act,value,R){
  T(d,row).style.background='var(--color-surface-sunken)';T(d,lab).style.color='var(--color-neutral-400)';
  T(d,val).outerHTML='<div style="min-width:0"><div style="font-size:12.5px;color:var(--color-neutral-500)">'+value+'</div><div style="font-size:11px;color:var(--color-warning-ink);margin-top:3px">Flagged · '+R.flag+'</div></div>';
  html(d,act,'<i class="ph ph-warning-diamond" style="font-size:15px;color:var(--color-warning-ink)"></i><span style="font-size:11px;color:var(--color-neutral-500)">Unflag</span>');
}
function pubFooter(d,n){
  html(d,235,'Goes back to <span style="color:var(--color-text)">'+ED+'</span> · status becomes Rejected');
  html(d,237,'<span style="display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:var(--radius-md);border:1px solid var(--color-neutral-800);font-size:12px;font-weight:500;color:var(--color-neutral-300)">Save draft</span>'+
    '<span data-p="reject" role="button" tabindex="0" style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:var(--radius-md);background:var(--color-accent);color:var(--color-bg);font-size:12px;font-weight:500;cursor:pointer"><i class="ph ph-arrow-u-up-left" style="font-size:13px"></i>Reject · '+n+' reason'+(n>1?'s':'')+'</span>');
}

/* ---------- publisher: Lupin S4-E2, Spain ---------- */
function setupPub(){
  const d=D(pubF);
  txt(d,35,'Lupin');txt(d,37,'Episode 2');txt(d,50,'Episode 2');
  txt(d,56,'Lupin · Season 4 · 24:31 · Spain (ES) · licensed to 2029');
  txt(d,60,'2 h ago · '+ED);txt(d,84,ED+' · 2 h ago');txt(d,89,ED+' · 2 h ago');
  txt(d,63,'17 Feb 2026 (5d)');txt(d,66,'40 complete · 1 flagged');
  txt(d,83,'Audio came from the vendor as ES 5.1. Spanish subtitles are checked.');
  txt(d,88,"Spain's rating wasn't in the delivery.");
  html(d,103,"L'ombre du père <span style=\"font-size:11px;color:var(--color-neutral-500);margin-left:6px\">FR fallback</span>");
  txt(d,110,"L'ombre du père");txt(d,117,'Crime · Drama');
  txt(d,132,'Synopsis (ES)');txt(d,133,'—');T(d,133).style.color='var(--color-neutral-500)';
  txt(d,139,'Synopsis (EN)');txt(d,140,'Assane closes in on the Pellegrini estate as the auction begins.');
  txt(d,147,'Hugo Gélin');txt(d,163,'ES 5.1 · EN 2.0');txt(d,169,'Subtitles (ES)');txt(d,170,'Delivered · 612 cues');
  txt(d,191,'ES · FR · DE · UK, 4 regions');txt(d,216,'4 / 4');txt(d,220,'to 2029');
  flagRow(d,122,123,124,125,'—',R1);
  txt(d,224,'1');T(d,226).outerHTML=CARD(R1,X);pubFooter(d,1);
  [...d.querySelectorAll('[style*="background-image"]')].forEach(e=>{if(e.getBoundingClientRect().width>80)e.style.backgroundImage='url(lupin.jpg)'});
  [...d.querySelectorAll('img')].forEach(e=>{if(e.getBoundingClientRect().width>80)e.src='lupin.jpg'});
  {const w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);let n;const seen=new Set();while(n=w.nextNode()){if(!/Alex Rivard/.test(n.textContent))continue;let e=n.parentElement;for(let i=0;i<4&&e;i++,e=e.parentElement){e.querySelectorAll('img,[style*="background-image"]').forEach(a=>{const r=a.getBoundingClientRect();if(r.width>0&&r.width<=36&&!seen.has(a)){seen.add(a);if(a.tagName==='IMG')a.src='../../ds/rivard.png';else a.style.backgroundImage='url(../../ds/rivard.png)'}})}}}
  d.documentElement.style.scrollBehavior='smooth';
}

/* ---------- editor: new export, Rejected with 2 reasons ---------- */
function setupEd(){
  const d=D(edF);
  const ch=T(d,96).parentElement;ch.setAttribute('data-p','chip');
  [0,1].forEach(i=>{const b=T(d,127,i);b.setAttribute('data-p','res'+(i+1));b.setAttribute('role','button');b.setAttribute('tabindex','0');b.style.cursor='pointer';
    let c=b;while(c.parentElement&&!/border/.test(c.getAttribute('style')||'')||c===b)c=c.parentElement;c.setAttribute('data-p','rc'+(i+1));});
  const age=T(d,153).parentElement;age.setAttribute('data-p','age');age.style.position='relative';age.style.cursor='pointer';
  T(d,184).parentElement.setAttribute('data-p','syn');
  const sb=[...d.querySelectorAll('div,span')].find(e=>e.textContent.trim()==='Submit for review'&&e.getBoundingClientRect().width>60);sb.setAttribute('data-p','submit');sb.style.cursor='pointer';
  txt(d,229,'17 Feb 2026 to 9 Feb 2029');
  txt(d,322,'The delivery says Crime · Drama. The synopsis and cast suggest Thriller might fit better.');
  txt(d,337,'You submitted ');T(d,337).appendChild(el(d,'<span style="color:var(--color-neutral-500)">Lupin · S4-E2</span>'));
  txt(d,339,'2 h ago');txt(d,345,'3 h ago');txt(d,351,'3 h ago');
  d.documentElement.style.scrollBehavior='smooth';
}
function counts(d,left,open){html(d,117,'<span>'+left+'</span> to resolve');txt(d,141,open+' fields open')}
function resolved(d,key,labId,left){
  const b=P(d,'res'+key);b.removeAttribute('data-p');b.removeAttribute('role');b.style.cursor='default';
  b.textContent='Resolved';b.style.color='var(--color-neutral-400)';b.style.borderColor='var(--color-neutral-800)';
  const c=P(d,'rc'+key);if(c)c.style.opacity='.7';
  const l=T(d,labId);l.textContent='Resolved';l.style.color='var(--color-neutral-400)';
  counts(d,left,left+3);
}

/* ---------- actions ---------- */
async function typeInto(set,text,ms){if(reduce){set(text);return}let v='';for(const ch of text){v+=ch;set(v);await sleep(ms)}}
const A={
  async comment(){
    const d=D(pubF),row=T(d,131);
    const box=el(d,'<div data-p="cbox" style="padding:0 15px 12px 187px;display:flex;flex-direction:column;gap:8px">'+
      '<textarea rows="2" style="resize:none;width:100%;box-sizing:border-box;padding:10px 12px;border-radius:var(--radius-md);border:1px solid var(--color-accent-600);background:var(--color-surface);color:var(--color-text);font:12.5px/1.5 var(--font-body);outline:none"></textarea>'+
      '<div style="display:flex;justify-content:flex-end;gap:8px"><span style="display:inline-flex;align-items:center;height:28px;padding:0 10px;font-size:12px;color:var(--color-neutral-400)">Cancel</span>'+
      '<span data-p="save" role="button" tabindex="0" style="display:inline-flex;align-items:center;height:28px;padding:0 14px;border-radius:var(--radius-md);background:var(--color-accent);color:var(--color-bg);font-size:12px;font-weight:500;cursor:pointer">Save</span></div></div>');
    row.after(box);const ta=box.querySelector('textarea');await typeInto(v=>ta.value=v,R2.text,14);
  },
  async save(){
    const d=D(pubF);P(d,'cbox').remove();
    flagRow(d,131,132,133,134,'—',R2);
    txt(d,66,'39 complete · 2 flagged');txt(d,224,'2');
    P(d,'rcard1').after(el(d,CARD(R2,X)));pubFooter(d,2);
  },
  async reject(){
    const d=D(pubF),pair=R=>'<div style="display:flex;gap:6px"><span style="'+chip+'">'+R.field+'</span><span style="'+chip+'">'+R.cat+'</span></div>';
    d.body.appendChild(el(d,'<div data-p="modal" style="position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50">'+
      '<div style="width:380px;padding:18px;border-radius:var(--radius-lg);background:var(--color-surface);border:1px solid var(--color-neutral-800);display:flex;flex-direction:column;gap:12px">'+
      '<div style="font-size:14px;font-weight:500;color:var(--color-text)">Reject with 2 reasons?</div>'+
      '<div style="font-size:12px;color:var(--color-neutral-400);line-height:1.5">'+ED+' gets each reason attached to its field.</div>'+
      '<div style="display:flex;flex-direction:column;gap:6px">'+pair(R1)+pair(R2)+'</div>'+
      '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px"><span style="display:inline-flex;align-items:center;height:32px;padding:0 12px;font-size:12px;color:var(--color-neutral-400)">Cancel</span>'+
      '<span data-p="confirm" role="button" tabindex="0" style="display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:var(--radius-md);background:var(--color-danger-fill);color:var(--color-on-danger);font-size:12px;font-weight:500;cursor:pointer">Reject</span></div></div></div>'));
  },
  async confirm(){
    const d=D(pubF);P(d,'modal').remove();
    statusChip(d,T(d,51),'Rejected','rejected');
    d.body.appendChild(el(d,'<div style="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:var(--radius-md);background:var(--color-surface-alt);border:1px solid var(--color-neutral-800);font-size:12px;color:var(--color-text);z-index:40;white-space:nowrap"><i class="ph ph-check-circle" style="font-size:14px;color:var(--st-rejected-ink)"></i>Rejected. '+ED+' has 2 reasons to resolve.<span style="color:var(--color-accent-300)">Back to reviews</span></div>'));
    await sleep(reduce?600:1500);
    banner.classList.add('show');await sleep(reduce?400:900);
    pubF.classList.add('off');edF.classList.remove('off');await sleep(reduce?300:900);
    banner.classList.remove('show');
  },
  async res1(){
    const d=D(edF),f=P(d,'age');f.scrollIntoView({block:'center'});await sleep(450);
    f.style.borderColor='var(--color-accent)';f.style.boxShadow='0 0 0 3px color-mix(in srgb, var(--color-accent) 25%, transparent)';
  },
  async open(){
    const d=D(edF),f=P(d,'age');
    const opts=['7','12','16','18'].map(v=>'<div data-p="opt'+v+'" role="option" style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:6px;font-size:13px;color:var(--color-text);cursor:pointer">'+v+(v==='16'?'<span style="font-size:11px;color:var(--color-neutral-500)">ICAA, this series</span>':'')+'</div>').join('');
    f.appendChild(el(d,'<div data-p="menu" role="listbox" style="position:absolute;left:0;right:0;top:calc(100% + 6px);padding:4px;border-radius:var(--radius-md);background:var(--color-surface);border:1px solid var(--color-neutral-800);box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:30">'+opts+'</div>'));
  },
  async pick(){
    const d=D(edF),f=P(d,'age');P(d,'menu').remove();const v=T(d,153);v.textContent='16';v.style.color='var(--color-text)';
    f.style.borderColor='var(--color-neutral-800)';f.style.boxShadow='none';
    resolved(d,'1',147,1);
  },
  async res2(){
    const d=D(edF),f=P(d,'syn'),v=T(d,184);f.scrollIntoView({block:'center'});await sleep(450);
    f.style.borderColor='var(--color-accent)';f.style.boxShadow='0 0 0 3px color-mix(in srgb, var(--color-accent) 25%, transparent)';
    v.style.color='var(--color-text)';
    await typeInto(t=>{v.textContent=t;txt(d,185,t.length+' / 240')},SYN,28);
    await sleep(300);f.style.borderColor='var(--color-neutral-800)';f.style.boxShadow='none';
    resolved(d,'2',178,0);
    Object.assign(P(d,'submit').style,{background:'var(--color-accent)',color:'var(--color-bg)',opacity:'1'});
    d.documentElement.scrollTo({top:0});
  },
  async submit(){
    const d=D(edF);statusChip(d,P(d,'chip'),'Pending review','pending');
    d.body.appendChild(el(d,'<div style="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius-md);background:var(--color-surface-alt);border:1px solid var(--color-neutral-800);font-size:12px;color:var(--color-text);z-index:40;white-space:nowrap"><i class="ph ph-check-circle" style="font-size:14px;color:var(--color-accent-300)"></i>Submitted. Maya Okafor re-checks 2 fields.</div>'));
    await sleep(reduce?500:1400);endEl.classList.add('show');
  }
};

/* ---------- script of steps ---------- */
const STEPS=[
  {s:1,f:'pub',t:()=>T(D(pubF),136),tip:'The age rating is already flagged. The Spanish synopsis is empty too: comment on that row.',a:'comment'},
  {s:1,f:'pub',t:()=>P(D(pubF),'save'),tip:'Save it. The comment becomes a reason with its field attached.',a:'save'},
  {s:2,f:'pub',t:()=>P(D(pubF),'reject'),tip:'Reject. The button counts what goes back.',a:'reject'},
  {s:2,f:'pub',t:()=>P(D(pubF),'confirm'),tip:'Confirm who gets it back.',a:'confirm'},
  {s:3,f:'ed',t:()=>P(D(edF),'res1'),tip:'Both reasons sit at the top. Resolve takes you to the field.',a:'res1'},
  {s:3,f:'ed',t:()=>P(D(edF),'age'),tip:'Open the rating.',a:'open'},
  {s:3,f:'ed',t:()=>P(D(edF),'opt16'),tip:'Spain needs 16. Setting it resolves the reason.',a:'pick'},
  {s:3,f:'ed',t:()=>P(D(edF),'res2'),tip:'Now the synopsis.',a:'res2'},
  {s:4,f:'ed',t:()=>P(D(edF),'submit'),tip:'Submit. Only these two fields go back for review.',a:'submit'}
];
const frame=k=>k==='pub'?pubF:edF;

function setSteps(n){document.querySelectorAll('.step').forEach(e=>{const v=+e.dataset.s;e.classList.toggle('on',v===n);e.classList.toggle('done',v<n)})}
function rectOf(st){const t=st&&st.t();if(!t)return null;const r=t.getBoundingClientRect();return{x:r.left*s,y:r.top*s,w:r.width*s,h:r.height*s}}
let tipOn=false,tipTimer=null;
function showTip(){tipOn=true;clearTimeout(tipTimer);place();tipTimer=setTimeout(()=>{tipOn=false;tip.classList.remove('show')},4000)}
function place(){
  const st=STEPS[step];const r=rectOf(st);
  if(!r||busy){ring.classList.remove('show');tip.classList.remove('show');return}
  const p=4;Object.assign(ring.style,{left:(r.x-p)+'px',top:(r.y-p)+'px',width:(r.w+2*p)+'px',height:(r.h+2*p)+'px'});
  ring.classList.add('show');
  if(!tipOn){tip.classList.remove('show');return}
  tip.innerHTML='<small>Step '+st.s+' of 4</small>'+st.tip;tip.classList.add('show');
  const tw=tip.offsetWidth,th=tip.offsetHeight,sw=stage.clientWidth,sh=stage.clientHeight;
  let x=r.x+r.w/2-tw/2,y=r.y+r.h+12;
  if(y+th>sh-8)y=r.y-th-12;
  x=Math.max(8,Math.min(sw-tw-8,x));y=Math.max(8,y);
  tip.style.left=x+'px';tip.style.top=y+'px';
}
async function go(i){
  step=i;const st=STEPS[i];if(!st){ring.classList.remove('show');tip.classList.remove('show');return}
  setSteps(st.s);
  const t=st.t();if(t){const r=t.getBoundingClientRect();if(r.top<70||r.bottom>H-70){t.scrollIntoView({block:'center'});await sleep(350)}}
  showTip();
  if(auto&&visible)autoplay(run);
}
async function act(){
  if(busy)return;const st=STEPS[step];busy=true;place();cur.classList.remove('show');
  await A[st.a]();busy=false;await go(step+1);
}
async function autoplay(id){
  await sleep(1300);if(!auto||id!==run||busy)return;
  const r=rectOf(STEPS[step]);if(!r)return;
  cur.classList.add('show');cur.style.transform='translate('+(r.x+r.w/2)+'px,'+(r.y+r.h/2)+'px)';
  await sleep(900);if(!auto||id!==run)return;
  cur.classList.add('click');await sleep(160);cur.classList.remove('click');
  act();
}
function takeOver(){if(!auto)return;auto=false;run++;cur.classList.remove('show');mode.textContent='Your turn. Follow the hint.'}
function wire(f){
  const d=D(f);
  d.addEventListener('scroll',()=>{if(!busy)place()},{passive:true,capture:true});
  d.addEventListener('click',e=>{
    if(!e.isTrusted)return;takeOver();
    const st=STEPS[step];if(!st||busy||frame(st.f)!==f)return;
    const t=st.t();
    if(t&&(t===e.target||t.contains(e.target))){act();return}
    showTip();tip.classList.remove('nudge');void tip.offsetWidth;if(!reduce)tip.classList.add('nudge');
  },true);
  d.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;const st=STEPS[step];if(!st)return;const t=st.t();
    if(t&&(t===e.target||t.contains(e.target))){e.preventDefault();takeOver();act()}
  });
}
async function start(){
  run++;clearTimeout(timer);busy=false;step=-1;endEl.classList.remove('show');
  pubF.classList.remove('off');edF.classList.add('off');
  await Promise.all([pubF,edF].map(f=>new Promise(r=>{f.onload=r;f.contentWindow.location.reload()})));
  init();
}
function init(){setupPub();setupEd();wire(pubF);wire(edF);fit();go(0)}
$('restart').onclick=()=>{auto=!reduce;mode.textContent=auto?'Playing. Click anywhere to take over.':'Follow the hint.';start()};
$('again').onclick=()=>$('restart').onclick();
if(reduce)mode.textContent='Follow the hint.';
let loaded=0;[pubF,edF].forEach(f=>f.addEventListener('load',()=>{if(++loaded===2)init()},{once:true}));
new IntersectionObserver(e=>{const was=visible;visible=e[0].isIntersecting;if(visible&&!was&&auto&&step>=0)autoplay(run)},{threshold:.4}).observe(stage);
if(window.top===window){const fl=document.getElementById('full');if(fl)fl.remove();document.body.style.padding='16px'}
fit();
})();
</script>
