<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#121212;color:#edebe8;font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#w{width:1200px;transform-origin:0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px;padding:40px 48px;box-sizing:border-box;border-radius:12px;background:#191919;border:1px solid #2a2927}
.c{display:flex;flex-direction:column;gap:6px;min-width:0}
.t{font-size:13px;font-weight:500}.d{font-size:12px;color:#96938d;line-height:1.5;margin-bottom:10px}
img{display:block;width:100%;max-width:320px;height:auto;border-radius:8px}
</style></head><body><div id="w">
<div class="c"><span class="t">Rule checks</span><span class="d">Pass or fail, never a guess. They live in the Readiness panel and pass the moment the field is valid.</span><img src="rules.webp" width="292" height="235" alt="Automatic checks for Spain: age rating, localised title and Spanish synopsis fail; language track and rights window pass"></div>
<div class="c"><span class="t">AI suggestions</span><span class="d">Judgement calls only. Each card names its evidence and how sure it is.</span><img src="ai.webp" width="319" height="114" alt="AI suggestion: genre may be wrong, the synopsis and cast suggest Thriller, marked AI uncertain"></div>
</div>
<script>(function(){var w=document.getElementById('w');function fit(){var s=Math.min(1,document.documentElement.clientWidth/1200);w.style.transform='scale('+s+')';var h=Math.ceil(w.offsetHeight*s);document.body.style.height=h+'px';try{parent.postMessage({backlotProto:'ds-rules',height:h},'*')}catch(e){}}addEventListener('resize',fit);addEventListener('load',fit);fit()})();</script></body></html>
