<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Backlot: Episode 2</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}.stage{position:relative;overflow:hidden;border-radius:8px;background:#121212}.stage iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0}</style></head>
<body><div class="stage" id="stage"><iframe src="page.html" title="Episode 2 metadata page in Backlot, scroll the middle column to see every field"></iframe></div>
<script>(function(){var st=document.getElementById('stage'),f=st.firstElementChild;function fit(){var s=st.clientWidth/1440;f.style.transform='scale('+s+')';st.style.height=(900*s)+'px';try{parent.postMessage({backlotProto:'ep2',height:document.body.scrollHeight},'*')}catch(e){}}addEventListener('resize',fit);addEventListener('load',fit);fit()})();</script>
</body></html>
