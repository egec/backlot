<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Logo test | Ege Coskun</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F7F5;--ink:#161616;--mute:#6B6A66;--gray:#BDBCB7;--pad:clamp(20px,2.4vw,44px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Inter Tight",system-ui,sans-serif}
header{position:fixed;left:0;right:0;top:0;height:76px;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad)}
header nav{display:flex;gap:28px;font-size:15px;color:var(--mute)}header nav a{color:inherit;text-decoration:none}header nav a:first-child{color:var(--ink)}
#hl{white-space:nowrap;line-height:1;visibility:hidden}
.hero{min-height:100svh;padding:clamp(120px,18svh,200px) var(--pad) clamp(90px,13svh,130px);display:flex;flex-direction:column;justify-content:space-between}
.tag{margin:0;max-width:20em;font-size:clamp(15px,1.45vw,24px);line-height:1.25;font-weight:500;letter-spacing:-.01em;will-change:transform,opacity}
#sp{align-self:flex-start;width:min(100%,var(--w,780px))}
#fly{position:fixed;left:0;top:0;z-index:60;pointer-events:none;transform-origin:0 0;will-change:transform;font-size:200px;line-height:1;white-space:nowrap;color:var(--ink)}
#hl{display:block}
canvas{display:block}
section.more{padding:clamp(80px,12vw,200px) var(--pad);border-top:1px solid #E0E0DD}
section.more p{max-width:34em;font-size:16px;line-height:1.55;color:#3a3936;margin:0}
</style>
</head>
<body>
<header><a href="#" id="hla" style="text-decoration:none;color:inherit"><canvas id="hl" aria-label="Ege Coskun"></canvas></a><nav><a href="#">Work</a><a href="#">About</a><a href="#">Contact</a></nav></header>
<main>
<section class="hero"><p class="tag" id="tag">Product designer for B2B software,<br>fluent in both AI and the people.</p><div id="sp" aria-hidden="true"></div></section>
<section class="more"><p>Scroll to see the logo travel to the header. It writes itself on when the page opens; reload to see it again.</p></section>
<section class="more"><p>More page below, so there is room to scroll back.</p></section>
<section class="more" style="min-height:70svh"></section>
</main>
<canvas id="fly" aria-hidden="true"></canvas>
<script>
var fly=document.getElementById('fly'),hl=document.getElementById('hl'),sp=document.getElementById('sp'),tag=document.getElementById('tag');
var R=matchMedia('(prefers-reduced-motion:reduce)').matches,cur=-1,raf=0,nw=1,nh=1;
var IW=0,IH=0,ink,tn,img=new Image(),prog=R?2:0,t0=0,wrote=false;
function run(){return innerHeight*.34}
function tgt(){return Math.max(0,Math.min(1,scrollY/Math.max(1,run())))}
function paint(c,p){var x=c.getContext('2d'),d=x.createImageData(IW,IH),o=d.data,E=900,P=p*(65535+E);
 for(var i=0,j=0;i<ink.length;i++,j+=4){var a=ink[i];if(!a)continue;var v=(P-tn[i])/E;if(v<=0)continue;if(v>1)v=1;o[j]=22;o[j+1]=22;o[j+2]=22;o[j+3]=a*v}
 x.putImageData(d,0,0)}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function wf(now){if(!t0)t0=now;var q=Math.min(1,(now-t0)/3200);prog=q;paint(fly,ease(q));if(q<1)requestAnimationFrame(wf);else{prog=2;paint(hl,1)}}
function draw(){
 var t=tgt();cur=cur<0?t:cur+(t-cur)*.16;if(Math.abs(t-cur)<.0015)cur=t;
 var a=sp.getBoundingClientRect(),b=hl.getBoundingClientRect(),a0=a.top+scrollY,e=cur*cur*(3-2*cur),sc=(a.width+(b.width-a.width)*e)/nw,x=a.left+(b.left-a.left)*e,y=a0+(b.top-a0)*Math.pow(cur,.75);
 fly.style.transform='translate('+x.toFixed(2)+'px,'+y.toFixed(2)+'px) scale('+sc.toFixed(4)+')';
 var done=cur>=.999&&prog>=2;fly.style.visibility=done?'hidden':'visible';hl.style.visibility=done?'visible':'hidden';
 tag.style.transform='translateX('+(-cur*22).toFixed(1)+'%) scale('+(1-.35*cur).toFixed(3)+')';tag.style.opacity=Math.max(0,1-cur*1.3).toFixed(3);
 if(cur!==t||prog<2)raf=requestAnimationFrame(draw);else raf=0}
function go(){if(!raf)raf=requestAnimationFrame(draw)}
img.onload=function(){
 var c=document.createElement('canvas');IW=c.width=img.width;IH=c.height=img.height;var x=c.getContext('2d');x.drawImage(img,0,0);var d=x.getImageData(0,0,IW,IH).data;
 ink=new Uint8Array(IW*IH);tn=new Uint16Array(IW*IH);for(var i=0,j=0;i<ink.length;i++,j+=4){ink[i]=d[j];tn[i]=d[j+1]*256+d[j+2]}
 fly.width=hl.width=IW;fly.height=hl.height=IH;nw=IW;nh=IH;fly.style.width=IW+'px';fly.style.height=IH+'px';
 hl.style.width="150px";hl.style.height=(150*IH/IW)+"px";
 sp.style.aspectRatio=(IW/IH).toFixed(4);sp.style.setProperty('--w','780px');
 paint(hl,1);
 if(R){paint(fly,1)}else{requestAnimationFrame(wf)}
 go()};
img.src='/logo/ege-tm.png';
addEventListener('scroll',go,{passive:true});addEventListener('resize',go);
</script>
</body>
</html>
