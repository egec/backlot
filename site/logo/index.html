<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Logo test | Ege Coskun</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:RS;src:url(/logo/RockSalt-Regular.ttf)}
@font-face{font-family:BE;src:url(/logo/BethEllen-Regular.ttf)}
@font-face{font-family:GG;src:url(/logo/GiveYouGlory.ttf)}
@font-face{font-family:PM;src:url(/logo/PermanentMarker-Regular.ttf)}
@font-face{font-family:OI;src:url(/logo/Oi-Regular.ttf)}
:root{--bg:#F7F7F5;--ink:#161616;--mute:#6B6A66;--pad:clamp(20px,2.4vw,44px)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Inter Tight",system-ui,sans-serif}
header{position:fixed;left:0;right:0;top:0;height:76px;display:flex;align-items:center;justify-content:flex-end;gap:28px;padding:0 var(--pad);font-size:15px;color:var(--mute)}
header a{color:inherit;text-decoration:none}header a:first-child{color:var(--ink)}
.hero{min-height:100svh;padding:clamp(120px,18svh,200px) var(--pad) clamp(120px,18svh,170px);display:flex;flex-direction:column;justify-content:space-between}
.tag{margin:0;max-width:20em;font-size:clamp(22px,2.1vw,36px);line-height:1.2;font-weight:500;letter-spacing:-.01em}
#logo{align-self:flex-start;white-space:nowrap;line-height:1;color:var(--ink);font-size:200px;margin:0}
nav.tabs{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:18px;display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:96vw;padding:6px;background:#fff;border:1px solid #E0E0DD;border-radius:999px}
nav.tabs button{font:500 12.5px "Inter Tight",sans-serif;border:0;background:none;color:var(--mute);padding:8px 11px;border-radius:999px;white-space:nowrap;cursor:pointer}
nav.tabs button[aria-pressed=true]{background:#56652A;color:#fff}
@media(max-width:700px){.hero{padding-bottom:200px}}
</style>
</head>
<body>
<header><a href="#">Work</a><a href="#">About</a><a href="#">Contact</a></header>
<main class="hero">
<p class="tag">Product designer for B2B software, fluent in both AI and the people.</p>
<div id="logo" aria-label="Ege Coskun">Ege Coskun</div>
</main>
<nav class="tabs" id="tabs"></nav>
<script>
var V=[['Rock Salt','RS','EGE COSKUN'],['Beth Ellen','BE','Ege Coskun'],['Beth Ellen, lowercase','BE','ege coskun'],['Give You Glory','GG','ege coskun'],['Give You Glory, caps','GG','Ege Coskun'],['Permanent Marker','PM','EGE COSKUN'],['Oi','OI','ege']];
var lg=document.getElementById('logo'),tb=document.getElementById('tabs'),cur=0;
function fit(){var w=Math.min(innerWidth-2*parseFloat(getComputedStyle(document.querySelector('.hero')).paddingLeft),V[cur][2].length<5?560:800);lg.style.fontSize='200px';var r=lg.getBoundingClientRect();lg.style.fontSize=(200*w/r.width)+'px'}
function set(i){cur=i;lg.style.fontFamily=V[i][1]+',cursive';lg.textContent=V[i][2];[].forEach.call(tb.children,function(b,k){b.setAttribute('aria-pressed',k==i)});(document.fonts&&document.fonts.load?document.fonts.load('100px '+V[i][1],V[i][2]):Promise.resolve()).then(fit);fit();try{history.replaceState(0,'','#'+(i+1))}catch(e){}}
V.forEach(function(v,i){var b=document.createElement('button');b.textContent=String.fromCharCode(65+i)+' '+v[0];b.onclick=function(){set(i)};tb.appendChild(b)});
addEventListener('resize',fit);
var h=parseInt(location.hash.slice(1))||1;set(Math.min(V.length,h)-1);
</script>
</body>
</html>
